name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode or Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 from secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          else
            echo "Generating release keystore on the fly..."
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -alias everhaptics \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass everhapticspass \
              -keypass everhapticspass \
              -dname "CN=EverHaptics, OU=Mobile, O=OpenSource, L=City, ST=State, C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'everhapticspass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'everhaptics' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'everhapticspass' }}
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release_assets/EverHaptics-release.apk
            fi
          done
          for apk in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release_assets/EverHaptics-debug.apk
            fi
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverHaptics-release-apk
          path: release_assets/EverHaptics-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverHaptics-debug-apk
          path: release_assets/EverHaptics-debug.apk
          if-no-files-found: warn

      - name: Determine Release Tag
        id: release_meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v5.1.0-$(date +'%Y%m%d%H%M')"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Target Tag: ${TAG_NAME}"

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Release ${{ steps.release_meta.outputs.tag_name }}
          files: release_assets/*.apk
          generate_release_notes: true
          make_latest: true
